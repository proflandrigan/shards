name: runtime

# E2.1 exit criterion: `shards-mcp` starts on Linux, macOS and Windows.
# Observed green on ubuntu, macOS and Windows (Node 18/20/22) on 2026-11-17 (wip/ci-portability runs).
on:
  workflow_dispatch:
  push:
    branches: [next, main]
  pull_request:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Node 18 proof without vitest (vitest 4 needs node:util styleText, Node 20+): plain stdio handshake + tools/list.
      - name: Runtime smoke (stdio MCP handshake + tools/list, no test framework)
        run: node scripts/runtime-smoke.js
      - name: Runtime tests (real stdio MCP handshake, locked state, events)
        if: matrix.node != 18
        run: npx vitest run test/runtime-
