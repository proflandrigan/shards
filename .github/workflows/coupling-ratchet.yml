name: coupling-ratchet
on:
  pull_request:
  push:
    branches: [next, main]
jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run coupling:ratchet
      - run: npm run build:all
      - run: npm run lint:models
