  advise: modes/advise.md
  service: modes/service.md
  worker: modes/worker.md
reviewers: [data-modeller, researcher, ml-engineer, data-analyst, bi-engineer, analytics-engineer, backend-engineer, syn]
output_dir: "studies/{project}/"
jobs: [record, tasks, knowledge, review, artifacts]
