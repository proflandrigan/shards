<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shards UI</title>
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator_midnight.min.css">
<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0d14;
  color: #c8c8d8;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  font-size: 15px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── Header ─────────────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #080810;
  border-bottom: 1px solid #1a1a2c;
  flex-shrink: 0;
  height: 42px;
}
.logo {
  font-size: 15px;
  font-weight: bold;
  color: #FFD700;
  letter-spacing: 3px;
}
#header-center {
  display: flex;
  align-items: center;
  gap: 16px;
}
#active-agent-display {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.agent-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2a2a3a;
  display: inline-block;
  flex-shrink: 0;
  transition: background 0.4s;
}
#conn-status-area {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #444;
}
.conn-indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2a2a3a;
  transition: background 0.4s;
}
.conn-indicator.connected { background: #4CAF50; }
.conn-indicator.disconnected { background: #F44336; }

/* ─── Main layout ────────────────────────────────────────── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── Explorer sidebar ───────────────────────────────────── */
#explorer-sidebar {
  width: 240px;
  min-width: 140px;
  max-width: 500px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: #080810;
  border-right: 1px solid #1a1a2c;
  overflow: hidden;
}
#explorer-sidebar.collapsed {
  width: 36px !important;
  min-width: 36px;
}
#explorer-sidebar.collapsed #explorer-breadcrumb,
#explorer-sidebar.collapsed #explorer-listing { display: none; }

#explorer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  cursor: pointer;
  user-select: none;
  background: #0a0a14;
  border-bottom: 1px solid #12121e;
  flex-shrink: 0;
}
#explorer-header:hover { background: #0e0e1a; }
#explorer-toggle {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #3a3a54;
  display: flex;
  align-items: center;
  gap: 6px;
}
#explorer-toggle .chevron {
  display: inline-block;
  transition: transform 0.2s;
  font-size: 8px;
  color: #3a3a54;
}
#explorer-sidebar.collapsed #explorer-toggle .chevron { transform: rotate(-90deg); }
#explorer-sidebar.collapsed #explorer-toggle .label-text { display: none; }

#explorer-breadcrumb {
  padding: 4px 10px;
  font-size: 12px;
  color: #4a4a68;
  display: flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
  border-bottom: 1px solid #12121e;
  background: #090912;
  flex-shrink: 0;
}
.crumb {
  cursor: pointer;
  color: #5a5a78;
  padding: 1px 3px;
  border-radius: 3px;
  white-space: nowrap;
}
.crumb:hover { color: #9090b0; background: #141428; }
.crumb-sep { color: #2a2a3a; font-size: 8px; }
.crumb.current { color: #8888a8; cursor: default; }
.crumb.current:hover { background: none; color: #8888a8; }

#explorer-listing {
  overflow-y: auto;
  flex: 1;
}
.dir-entry {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 13px;
  color: #8888a8;
  transition: background 0.15s;
}
.dir-entry:hover { background: #0f0f1e; }
.dir-entry.is-dir { color: #9090b0; }
.dir-entry.is-file { color: #6a6a88; }
.dir-icon {
  font-size: 10px;
  width: 14px;
  text-align: center;
  flex-shrink: 0;
  color: #4a4a68;
}
.dir-entry.is-dir .dir-icon { color: #5a7aaa; }
.dir-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir-size { font-size: 11px; color: #3a3a54; flex-shrink: 0; }
.dir-entry.parent-entry { color: #5a5a78; font-style: italic; }
.dir-entry.parent-entry .dir-icon { color: #5a5a78; }

/* ─── Resize handles ─────────────────────────────────────── */
.resize-handle {
  width: 4px;
  cursor: col-resize;
  background: transparent;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.resize-handle:hover,
.resize-handle.dragging {
  background: #3860c0;
}

/* ─── Workspace ──────────────────────────────────────────── */
#workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ─── Workspace tab bar ──────────────────────────────────── */
#ws-tab-bar {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid #1a1a2c;
  background: #080810;
  flex-shrink: 0;
  min-height: 34px;
  overflow-x: auto;
  scrollbar-width: none;
}
#ws-tab-bar::-webkit-scrollbar { display: none; }

.ws-tab {
  padding: 0 14px;
  font-size: 12px;
  color: #4a4a68;
  cursor: pointer;
  white-space: nowrap;
  border-right: 1px solid #141420;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  transition: color 0.2s, background 0.2s;
  user-select: none;
}
.ws-tab:hover { color: #707090; background: #0c0c18; }
.ws-tab.active { color: #b0b0c8; background: #0d0d14; border-bottom: 2px solid #3860c0; }
.ws-tab.pinned { color: #8888a8; }
.ws-tab.pinned.active { color: #c8c8d8; }
.ws-tab.in-split { border-bottom: 2px solid #2a6a2a; }
.ws-tab .tab-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #4CAF50;
  display: none;
  flex-shrink: 0;
}
.ws-tab.unread .tab-dot { display: block; }
.ws-tab .modified-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #e0a040;
  display: none;
  flex-shrink: 0;
}
.ws-tab.modified .modified-dot { display: block; }
.ws-tab .close-btn {
  font-size: 13px;
  color: #333;
  cursor: pointer;
  margin-left: 2px;
  line-height: 1;
}
.ws-tab .close-btn:hover { color: #888; }

#ws-tab-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 4px;
  flex-shrink: 0;
}
#split-btn {
  background: #0f0f1e;
  border: 1px solid #1e1e32;
  border-radius: 4px;
  color: #5a5a78;
  font-family: inherit;
  font-size: 11px;
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.2s;
}
#split-btn:hover { background: #1a1a30; color: #8080a0; }
#split-btn.active { background: #1a2a1a; border-color: #2a6a2a; color: #60a060; }

/* ─── Workspace content ──────────────────────────────────── */
#ws-content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── Chat pane ──────────────────────────────────────────── */
#chat-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0d0d14;
  min-width: 0;
}
#conv-header {
  padding: 6px 16px;
  border-bottom: 1px solid #1a1a2c;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #333;
  flex-shrink: 0;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.empty-state {
  color: #2a2a3a;
  font-size: 13px;
  text-align: center;
  margin-top: 60px;
}
.message { max-width: 88%; line-height: 1.55; }
.message.user { align-self: flex-end; }
.message.assistant { align-self: flex-start; }
.message-meta {
  font-size: 12px;
  color: #3a3a50;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.message.user .message-meta { justify-content: flex-end; }
.meta-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.message-bubble {
  padding: 9px 13px;
  border-radius: 8px;
  font-size: 14px;
  word-break: break-word;
}
.message.user .message-bubble {
  background: #131320;
  color: #a0a0b8;
  border: 1px solid #1e1e32;
}
.message.assistant .message-bubble {
  background: #0b0b18;
  border-left: 3px solid #2a2a40;
  color: #c0c0d0;
}
.agent-divider {
  text-align: center;
  font-size: 12px;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  align-self: stretch;
}
.agent-divider::before, .agent-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #141420;
}

/* Tool use indicator in chat */
.tool-indicator {
  font-size: 12px;
  color: #4a4a68;
  padding: 4px 10px;
  margin: 2px 0;
  border-left: 2px solid #2a2a40;
  align-self: flex-start;
}
.tool-indicator .tool-name { color: #6a6a90; font-weight: 600; }

/* Markdown in bubbles */
.message-bubble h1 { font-size: 17px; color: #dde; margin: 10px 0 5px; }
.message-bubble h2 { font-size: 16px; color: #dde; margin: 9px 0 4px; }
.message-bubble h3 { font-size: 15px; color: #dde; margin: 8px 0 4px; }
.message-bubble h4, .message-bubble h5, .message-bubble h6 { font-size: 14px; color: #ccd; margin: 6px 0 3px; }
.message-bubble p { margin: 5px 0; }
.message-bubble code {
  background: #141428;
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 13px;
  color: #9ab4ff;
  font-family: inherit;
}
.message-bubble pre {
  background: #08080f;
  border: 1px solid #1a1a2c;
  border-radius: 6px;
  padding: 10px;
  overflow-x: auto;
  margin: 8px 0;
}
.message-bubble pre code { background: none; padding: 0; color: #c0c0d0; }
.message-bubble ul, .message-bubble ol { padding-left: 18px; margin: 5px 0; }
.message-bubble li { margin: 2px 0; }
.message-bubble strong { color: #e0e0f0; font-weight: 600; }
.message-bubble em { color: #9090b0; font-style: italic; }
.message-bubble hr { border: none; border-top: 1px solid #1a1a2c; margin: 10px 0; }
.message-bubble a { color: #5080e0; }
.message-bubble blockquote {
  border-left: 3px solid #1e1e30;
  padding-left: 10px;
  color: #666;
  margin: 5px 0;
}
.message-bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.message-bubble th, .message-bubble td { border: 1px solid #1e1e30; padding: 4px 8px; }
.message-bubble th { background: #0f0f1e; color: #c0c0d0; }

/* ─── Chat input bar ─────────────────────────────────────── */
#chat-input-area {
  display: none;
  padding: 8px 16px;
  border-top: 1px solid #1a1a2c;
  background: #080810;
  flex-shrink: 0;
  gap: 8px;
  align-items: center;
}
#chat-input-area.visible {
  display: flex;
}
#chat-input {
  flex: 1;
  background: #0d0d1a;
  border: 1px solid #1e1e32;
  border-radius: 6px;
  color: #c8c8d8;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.2s;
}
#chat-input:focus { border-color: #3860c0; }
#chat-input:disabled { opacity: 0.4; }
#chat-send-btn, #chat-stop-btn {
  background: #1a1a2c;
  border: 1px solid #2a2a40;
  border-radius: 5px;
  color: #808098;
  font-family: inherit;
  font-size: 13px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}
#chat-send-btn:hover { background: #252540; color: #b0b0c8; }
#chat-stop-btn { border-color: #5a2020; color: #c06060; }
#chat-stop-btn:hover { background: #2a1010; color: #e08080; }
#chat-send-btn:disabled { opacity: 0.3; cursor: default; }

/* ─── Agent picker grid ──────────────────────────────────── */
#agent-picker {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 20px 40px;
  overflow-y: auto;
  flex: 1;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}
#agent-picker.visible {
  display: flex;
}
.agent-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.agent-card:hover {
  background: #0f0f1e;
  border-color: #1a1a2c;
}
.agent-card-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.agent-card-name {
  font-size: 14px;
  font-weight: 600;
  color: #b0b0c8;
  white-space: nowrap;
  min-width: 200px;
}
.agent-card-desc {
  font-size: 13px;
  color: #4a4a68;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── File pane ──────────────────────────────────────────── */
#file-pane {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
  background: #0d0d14;
  min-width: 0;
}
#file-pane.visible { display: flex; }

#file-toolbar {
  display: flex;
  align-items: center;
  padding: 4px 12px;
  border-bottom: 1px solid #1a1a2c;
  background: #0a0a14;
  flex-shrink: 0;
  gap: 8px;
  min-height: 30px;
}
#file-path-display {
  flex: 1;
  font-size: 12px;
  color: #5a5a78;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toolbar-btn {
  background: #0f0f1e;
  border: 1px solid #1e1e32;
  border-radius: 4px;
  color: #6a6a88;
  font-family: inherit;
  font-size: 11px;
  padding: 2px 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.toolbar-btn:hover { background: #1a1a30; color: #9090b0; }
.toolbar-btn.active { background: #1a2a1a; border-color: #2a6a2a; color: #60a060; }
.toolbar-btn.save { border-color: #2a4a6a; color: #6090c0; }
.toolbar-btn.save:hover { background: #0a1a2a; color: #80b0e0; }

/* ─── File editor ────────────────────────────────────────── */
#file-editor {
  flex: 1;
  display: flex;
  overflow: hidden;
}
#line-gutter {
  width: 52px;
  overflow: hidden;
  background: #060610;
  color: #2a2a44;
  text-align: right;
  padding: 10px 8px 10px 0;
  font-size: 13px;
  line-height: 1.55;
  user-select: none;
  border-right: 1px solid #141420;
  flex-shrink: 0;
}
#file-view-area {
  flex: 1;
  overflow: auto;
  position: relative;
}
#code-view {
  margin: 0;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.55;
  background: none;
  border: none;
  color: #b0b0c4;
  white-space: pre;
  min-height: 100%;
}
#code-view code {
  background: none;
  padding: 0;
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
#code-edit {
  display: none;
  width: 100%;
  min-height: 100%;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.55;
  background: #0a0a16;
  color: #c0c0d0;
  border: none;
  outline: none;
  resize: none;
  padding: 10px 14px;
  tab-size: 4;
  white-space: pre;
  overflow-wrap: normal;
}
#code-edit.visible { display: block; }

/* File rendered view (markdown) */
#file-rendered-view {
  display: none;
  flex: 1;
  overflow: auto;
  padding: 14px 18px;
}
#file-rendered-view.visible { display: block; }

.file-rendered { font-size: 13px; line-height: 1.6; color: #b0b0c4; }
.file-rendered h1 { font-size: 16px; color: #dde; margin: 10px 0 5px; }
.file-rendered h2 { font-size: 15px; color: #ccd; margin: 9px 0 4px; border-bottom: 1px solid #1a1a2c; padding-bottom: 3px; }
.file-rendered h3 { font-size: 14px; color: #bbc; margin: 7px 0 3px; }
.file-rendered h4, .file-rendered h5, .file-rendered h6 { font-size: 13px; color: #aab; margin: 5px 0 2px; }
.file-rendered p { margin: 5px 0; }
.file-rendered code { background: #0d0d1e; border-radius: 3px; padding: 1px 4px; font-size: 12px; color: #8aa4ff; font-family: inherit; }
.file-rendered pre { background: #06060f; border: 1px solid #141420; border-radius: 5px; padding: 10px; overflow-x: auto; margin: 7px 0; }
.file-rendered pre code { background: none; padding: 0; color: #b0b0c0; }
.file-rendered ul, .file-rendered ol { padding-left: 16px; margin: 4px 0; }
.file-rendered li { margin: 2px 0; }
.file-rendered strong { color: #d0d0e0; }
.file-rendered em { color: #8888a8; }
.file-rendered hr { border: none; border-top: 1px solid #141420; margin: 8px 0; }
.file-rendered blockquote { border-left: 2px solid #1e1e30; padding-left: 8px; color: #555; margin: 4px 0; }
.file-rendered table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
.file-rendered th, .file-rendered td { border: 1px solid #1a1a2c; padding: 3px 7px; }
.file-rendered th { background: #0b0b16; color: #aab; }

/* ─── Table view (Tabulator) ─────────────────────────────── */
#table-view {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}
#table-view.visible { display: flex; }
#table-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border-bottom: 1px solid #1a1a2c;
  background: #0a0a14;
  flex-shrink: 0;
}
#table-search {
  background: #0f0f1e;
  border: 1px solid #1e1e32;
  border-radius: 4px;
  color: #b0b0c4;
  font-family: inherit;
  font-size: 11px;
  padding: 3px 8px;
  width: 180px;
  outline: none;
}
#table-search:focus { border-color: #3a3a5a; }
#table-row-count {
  font-size: 11px;
  color: #5a5a78;
  margin-left: auto;
}
#table-edit-btns { display: none; gap: 4px; }
#table-edit-btns.visible { display: flex; }
#table-container {
  flex: 1;
  overflow: hidden;
}
/* Tabulator midnight theme overrides for Shards palette */
#table-container .tabulator {
  background: #0d0d14;
  border: none;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  font-size: 12px;
  color: #b0b0c4;
}
#table-container .tabulator-header {
  background: #080810;
  border-bottom: 1px solid #1a1a2c;
}
#table-container .tabulator-col {
  background: #080810;
  border-right: 1px solid #1a1a2c;
}
#table-container .tabulator-col-title {
  color: #8888a8;
  font-weight: 600;
}
#table-container .tabulator-col .tabulator-header-filter input {
  background: #0f0f1e;
  border: 1px solid #1e1e32;
  color: #b0b0c4;
  font-family: inherit;
  font-size: 11px;
  border-radius: 3px;
  padding: 2px 4px;
}
#table-container .tabulator-row {
  border-bottom: 1px solid #111120;
  min-height: 26px;
}
#table-container .tabulator-row:hover { background: #12122a; }
#table-container .tabulator-row.tabulator-selected { background: #1a1a3a; }
#table-container .tabulator-cell {
  border-right: 1px solid #111120;
  padding: 3px 6px;
}
#table-container .tabulator-cell.tabulator-editing input {
  background: #0a0a16;
  color: #c0c0d0;
  border: 1px solid #3a3a5a;
  font-family: inherit;
  font-size: 12px;
}
#table-container .tabulator-tableholder {
  background: #0d0d14;
}
#table-container .tabulator-placeholder {
  color: #3a3a50;
}

/* ─── No-file placeholder ────────────────────────────────── */
.no-file-msg {
  color: #2a2a3a;
  font-size: 13px;
  text-align: center;
  margin-top: 60px;
}

<script>

// ═══════════════════════════════════════════════════════════════

  'ai-engineer':            { color: '#9C27B0', label: 'AI Engineer',                 desc: 'LLM workflows, RAG, prompt engineering, agentic systems',        type: 'specialist' },
  'data-engineer':          { color: '#FF9800', label: 'Data Engineer',               desc: 'Pipelines, dbt models, warehouse infrastructure',                type: 'specialist' },

  'mlops-engineer':         { color: '#FF5722', label: 'MLOps Engineer',              desc: 'Model deployment, serving, monitoring, retraining',               type: 'specialist' },

// ═══════════════════════════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════════════════════════

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

const LANG_MAP = {
  py: 'python', python: 'python',
  sql: 'sql',
  js: 'javascript', javascript: 'javascript',
  ts: 'typescript', typescript: 'typescript',
  json: 'json',
  yaml: 'yaml', yml: 'yaml',
  sh: 'bash', bash: 'bash',
  html: 'html', htm: 'html',
  css: 'css',
  rb: 'ruby', ruby: 'ruby',
  go: 'go',
  rs: 'rust', rust: 'rust',
  java: 'java',
  r: 'r',
};

function getLang(filePath) {
  const ext = filePath.split('.').pop().toLowerCase();
  return LANG_MAP[ext] || '';
}

// ═══════════════════════════════════════════════════════════════
// Markdown renderer
// ═══════════════════════════════════════════════════════════════

function renderMarkdown(md) {
  if (!md) return '';
  const lines = md.split('\n');
  const out = [];
  let inCode = false, codeLang = '', codeAcc = [];
  let inList = false, listType = '';

  function closeList() {
    if (inList) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
  }

  for (const line of lines) {
    if (line.startsWith('```')) {
      if (inCode) {
        const highlighted = highlightCode(esc(codeAcc.join('\n')), codeLang);
        out.push(`<pre><code>${highlighted}</code></pre>`);
        codeAcc = []; codeLang = ''; inCode = false;
      } else {
        closeList();
        codeLang = line.slice(3).trim();
        inCode = true;
      }
      continue;
    }
    if (inCode) { codeAcc.push(line); continue; }

    const isListLine = /^[-*]\s/.test(line) || /^\d+\.\s/.test(line);
    if (inList && !isListLine) closeList();

    if (line.trim() === '') { closeList(); out.push('<br>'); continue; }

    let m;
    if ((m = line.match(/^(#{1,6})\s(.+)/))) {
      closeList();
      const lvl = m[1].length;
      out.push(`<h${lvl}>${inlinemd(m[2])}</h${lvl}>`);
      continue;
    }
    if (/^---+$/.test(line.trim())) { closeList(); out.push('<hr>'); continue; }
    if (line.startsWith('> ')) { closeList(); out.push(`<blockquote>${inlinemd(line.slice(2))}</blockquote>`); continue; }

    if ((m = line.match(/^[-*]\s(.+)/))) {
      if (!inList || listType !== 'ul') { closeList(); out.push('<ul>'); inList = true; listType = 'ul'; }
      out.push(`<li>${inlinemd(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^\d+\.\s(.+)/))) {
      if (!inList || listType !== 'ol') { closeList(); out.push('<ol>'); inList = true; listType = 'ol'; }
      out.push(`<li>${inlinemd(m[1])}</li>`);
      continue;
    }

    out.push(`<p>${inlinemd(line)}</p>`);
  }

  closeList();
  if (inCode) out.push(`<pre><code>${esc(codeAcc.join('\n'))}</code></pre>`);
  return out.join('');
}

function inlinemd(text) {
  text = esc(text);
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  return text;
}

// ═══════════════════════════════════════════════════════════════
// Syntax highlighting
// ═══════════════════════════════════════════════════════════════

function highlightCode(escapedCode, lang) {
  if (!lang) return escapedCode;
  switch (lang.toLowerCase()) {
    case 'python': case 'py': return hlPython(escapedCode);
    case 'sql': return hlSQL(escapedCode);
    case 'javascript': case 'js': case 'typescript': case 'ts': return hlJS(escapedCode);
    case 'json': return hlJSON(escapedCode);
    case 'yaml': case 'yml': return hlYAML(escapedCode);
    default: return escapedCode;
  }
}

function hlPython(code) {
  const kws = 'def|class|import|from|return|if|elif|else|for|while|in|not|and|or|with|as|try|except|finally|raise|pass|break|continue|lambda|yield|global|nonlocal|del|assert|True|False|None|async|await|is|print';
  return code
    .replace(/(#[^\n]*)/g, '<span class="cmt">$1</span>')
    .replace(/("""[\s\S]*?"""|\'\'\'[\s\S]*?\'\'\'|"[^"\\]*(?:\\.[^"\\]*)*"|\'[^\'\\]*(?:\\.[^\'\\]*)*\')/g, '<span class="str">$1</span>')
    .replace(new RegExp(`\\b(${kws})\\b`, 'g'), '<span class="kw">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

function hlSQL(code) {
  const kws = 'SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|ON|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|COLUMN|INDEX|VIEW|WITH|AS|AND|OR|NOT|IN|IS|NULL|LIKE|BETWEEN|EXISTS|DISTINCT|COUNT|SUM|AVG|MIN|MAX|CASE|WHEN|THEN|ELSE|END|UNION|ALL|OVER|PARTITION|ROW_NUMBER|RANK|DENSE_RANK|COALESCE|CAST|DATE|TIMESTAMP';
  return code
    .replace(/(--[^\n]*)/g, '<span class="cmt">$1</span>')
    .replace(/('(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>')
    .replace(new RegExp(`\\b(${kws})\\b`, 'gi'), m => `<span class="kw">${m.toUpperCase()}</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

function hlJS(code) {
  const kws = 'const|let|var|function|return|if|else|for|while|do|class|extends|import|export|default|from|new|this|typeof|instanceof|in|of|try|catch|finally|throw|async|await|true|false|null|undefined|break|continue|switch|case|delete|void|yield|interface|type|enum|static|get|set';
  return code
    .replace(/(\/\/[^\n]*)/g, '<span class="cmt">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, '<span class="str">$1</span>')
    .replace(new RegExp(`\\b(${kws})\\b`, 'g'), '<span class="kw">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

function hlJSON(code) {
  return code
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="attr">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="str">$1</span>')
    .replace(/:\s*(\d+\.?\d*(?:[eE][+-]?\d+)?)/g, ': <span class="num">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="kw">$1</span>');
}

function hlYAML(code) {
  return code.split('\n').map(line => {
    if (/^\s*#/.test(line)) return `<span class="cmt">${line}</span>`;
    const m = line.match(/^(\s*\S[^:]*:)(.*)/);
    if (m) return `<span class="attr">${m[1]}</span><span class="str">${m[2]}</span>`;
    return line;
  }).join('\n');
}

// ═══════════════════════════════════════════════════════════════
// Explorer sidebar
// ═══════════════════════════════════════════════════════════════

let currentBrowseDir = null;

function toggleExplorer() {
  document.getElementById('explorer-sidebar').classList.toggle('collapsed');
}

async function browseDir(dir) {
  try {
    const url = dir ? `/browse?dir=${encodeURIComponent(dir)}` : '/browse';
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) return;
    currentBrowseDir = data.path;
    renderBreadcrumb(data.path);
    renderDirListing(data);
  } catch {}
}

function renderBreadcrumb(dirPath) {
  const el = document.getElementById('explorer-breadcrumb');
  el.innerHTML = '';
  const parts = dirPath.split('/').filter(Boolean);

  const root = document.createElement('span');
  root.className = 'crumb';
  root.textContent = '/';
  root.addEventListener('click', () => browseDir('/'));
  el.appendChild(root);

  for (let i = 0; i < parts.length; i++) {
    const cumPath = '/' + parts.slice(0, i + 1).join('/');
    const isCurrent = i === parts.length - 1;

    const sep = document.createElement('span');
    sep.className = 'crumb-sep';
    sep.textContent = '/';
    el.appendChild(sep);

    const crumb = document.createElement('span');
    crumb.className = 'crumb' + (isCurrent ? ' current' : '');
    crumb.textContent = parts[i];
    if (!isCurrent) crumb.addEventListener('click', () => browseDir(cumPath));
    el.appendChild(crumb);
  }
}

function renderDirListing(data) {
  const el = document.getElementById('explorer-listing');
  el.innerHTML = '';

  if (data.parent) {
    const parentEl = document.createElement('div');
    parentEl.className = 'dir-entry parent-entry is-dir';
    parentEl.innerHTML = '<span class="dir-icon">..</span><span class="dir-name">Parent directory</span>';
    parentEl.addEventListener('click', () => browseDir(data.parent));
    el.appendChild(parentEl);
  }

  for (const entry of data.entries) {
    const fullPath = data.path + '/' + entry.name;
    const row = document.createElement('div');

    if (entry.type === 'dir') {
      row.className = 'dir-entry is-dir';
      row.innerHTML = `<span class="dir-icon">&#128193;</span><span class="dir-name">${esc(entry.name)}</span>`;
      row.addEventListener('click', () => browseDir(fullPath));
    } else {
      row.className = 'dir-entry is-file';
      row.innerHTML = `<span class="dir-icon">&#128196;</span><span class="dir-name">${esc(entry.name)}</span><span class="dir-size">${formatSize(entry.size)}</span>`;
      row.addEventListener('click', () => openFileFromExplorer(fullPath));
    }
    el.appendChild(row);
  }

  if (data.entries.length === 0 && !data.parent) {
    el.innerHTML = '<div style="padding:8px 12px;color:#3a3a54;font-size:10px">Empty directory</div>';
  }
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function openFileFromExplorer(filePath) {
  try {
    const res = await fetch(`/browse/file?path=${encodeURIComponent(filePath)}`);
    const data = await res.json();
    if (data.error) return;
    const key = data.relPath || filePath;
    openFileTab(key, data.content, data.path);
  } catch {}
}

// ═══════════════════════════════════════════════════════════════
// Explorer resize
// ═══════════════════════════════════════════════════════════════

function initExplorerResize() {
  const handle = document.getElementById('explorer-resize');
  const sidebar = document.getElementById('explorer-sidebar');
  let startX, startW;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  function onMove(e) {
    const newW = Math.max(140, Math.min(500, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  }
  function onUp() {
    handle.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
}

// ═══════════════════════════════════════════════════════════════
// Tabular data viewer (CSV/TSV/JSON/JSONL)
// ═══════════════════════════════════════════════════════════════

const TABULAR_EXTS = ['csv', 'tsv', 'json', 'jsonl'];
const EDITABLE_TABULAR_EXTS = ['csv', 'tsv'];

function isTabularFile(relPath) {
  const ext = relPath.split('.').pop().toLowerCase();
  return TABULAR_EXTS.includes(ext);
}

function isEditableTabular(relPath) {
  const ext = relPath.split('.').pop().toLowerCase();
  return EDITABLE_TABULAR_EXTS.includes(ext);
}

function getTabularDelimiter(relPath) {
  return relPath.split('.').pop().toLowerCase() === 'tsv' ? '\t' : ',';
}

function flattenObject(obj, prefix) {
  const result = {};
  for (const [key, val] of Object.entries(obj)) {
    const newKey = prefix ? prefix + '.' + key : key;
    if (val && typeof val === 'object' && !Array.isArray(val)) {
      Object.assign(result, flattenObject(val, newKey));
    } else if (Array.isArray(val)) {
      result[newKey] = JSON.stringify(val);
    } else {
      result[newKey] = val;
    }
  }
  return result;
}

function flattenToTable(arr) {
  const flat = arr.map(item => flattenObject(item, ''));
  const colSet = new Set();
  for (const row of flat) {
    for (const k of Object.keys(row)) colSet.add(k);
  }
  const columns = Array.from(colSet);
  const data = flat.map(row => {
    const out = {};
    for (const col of columns) {
      out[col] = row[col] !== undefined ? row[col] : '';
    }
    return out;
  });
  return { columns, data };
}

function serializeToDelimited(columns, data, delimiter) {
  const escape = (val) => {
    const s = val == null ? '' : String(val);
    if (s.includes(delimiter) || s.includes('"') || s.includes('\n') || s.includes('\r')) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const lines = [columns.map(escape).join(delimiter)];
  for (const row of data) {
    lines.push(columns.map(col => escape(row[col])).join(delimiter));
  }
  return lines.join('\n') + '\n';
}

async function loadTabularData(relPath, f) {
  const ext = relPath.split('.').pop().toLowerCase();

  if (ext === 'csv' || ext === 'tsv') {
    const delimiter = ext === 'tsv' ? '\t' : ',';
    const res = await fetch('/browse/file/parse-csv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: f.absPath, delimiter }),
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    return result;
  }

  // JSON / JSONL — client-side parse + flatten
  if (ext === 'jsonl') {
    const lines = f.content.split('\n').filter(l => l.trim());
    const arr = lines.map(l => JSON.parse(l));
    return flattenToTable(arr);
  }

  // JSON
  let parsed = JSON.parse(f.content);
  if (!Array.isArray(parsed)) {
    if (parsed && typeof parsed === 'object') {
      parsed = [parsed];
    } else {
      throw new Error('JSON is not an object or array');
    }
  }
  if (parsed.length > 0 && typeof parsed[0] !== 'object') {
    throw new Error('JSON array does not contain objects');
  }
  return flattenToTable(parsed);
}

let activeTabulatorInstance = null;
let activeTabularColumns = null;

function destroyTabulator() {
  if (activeTabulatorInstance) {
    try { activeTabulatorInstance.destroy(); } catch {}
    activeTabulatorInstance = null;
    activeTabularColumns = null;
  }
}

function initTabulator(relPath, tableData) {
  destroyTabulator();

  const f = openFiles[relPath];
  const editable = isEditableTabular(relPath);

  // Store columns for serialization
  activeTabularColumns = tableData.columns;

  const columns = tableData.columns.map(col => ({
    title: col,
    field: col,
    headerFilter: 'input',
    sorter: 'string',
    resizable: true,
    editor: editable ? 'input' : false,
  }));

  if (editable) {
    columns.unshift({
      formatter: 'rowSelection',
      titleFormatter: 'rowSelection',
      headerSort: false,
      resizable: false,
      width: 30,
      cssClass: 'tabulator-row-select',
    });
  }

  const container = document.getElementById('table-container');
  container.innerHTML = '';

  activeTabulatorInstance = new Tabulator(container, {
    data: tableData.data,
    columns,
    layout: 'fitDataFill',
    height: '100%',
    virtualDom: true,
    selectableRows: editable ? true : false,
    placeholder: 'No data',
    cellEdited: editable ? function(cell) {
      if (f) {
        f.modified = true;
        renderWsTabs();
      }
    } : undefined,
  });

  // Update row count
  activeTabulatorInstance.on('dataLoaded', (data) => {
    document.getElementById('table-row-count').textContent = data.length + ' rows';
  });
  activeTabulatorInstance.on('dataFiltered', (filters, rows) => {
    document.getElementById('table-row-count').textContent = rows.length + ' rows';
  });

  // Show/hide edit buttons
  const editBtns = document.getElementById('table-edit-btns');
  editBtns.className = editable ? 'visible' : '';

  // Wire up global search
  const searchInput = document.getElementById('table-search');
  searchInput.value = '';
  searchInput.oninput = () => {
    const term = searchInput.value.toLowerCase();
    if (!term) {
      activeTabulatorInstance.clearFilter();
    } else {
      activeTabulatorInstance.setFilter((data) => {
        return Object.values(data).some(v =>
          v != null && String(v).toLowerCase().includes(term)
        );
      });
    }
  };

  // Store tabular data on file state
  f.tabularData = tableData;
  f.tabulatorInstance = activeTabulatorInstance;
}

function tableAddRow() {
  if (!activeTabulatorInstance || !activeTabularColumns) return;
  const empty = {};
  for (const col of activeTabularColumns) empty[col] = '';
  activeTabulatorInstance.addRow(empty);
  const key = getCurrentFileKey();
  if (key && openFiles[key]) {
    openFiles[key].modified = true;
    renderWsTabs();
  }
}

function tableDeleteSelectedRows() {
  if (!activeTabulatorInstance) return;
  const selected = activeTabulatorInstance.getSelectedRows();
  if (selected.length === 0) { alert('Select rows first (click the checkbox column)'); return; }
  selected.forEach(row => row.delete());
  const key = getCurrentFileKey();
  if (key && openFiles[key]) {
    openFiles[key].modified = true;
    renderWsTabs();
  }
}

function tableAddColumn() {
  if (!activeTabulatorInstance || !activeTabularColumns) return;
  const name = prompt('Column name:');
  if (!name || !name.trim()) return;
  const colName = name.trim();
  activeTabularColumns.push(colName);
  activeTabulatorInstance.addColumn({
    title: colName,
    field: colName,
    headerFilter: 'input',
    sorter: 'string',
    resizable: true,
    editor: 'input',
  });
  const key = getCurrentFileKey();
  if (key && openFiles[key]) {
    openFiles[key].modified = true;
    renderWsTabs();
  }
}

function tableDeleteColumn() {
  if (!activeTabulatorInstance || !activeTabularColumns) return;
  const name = prompt('Column name to delete:');
  if (!name || !name.trim()) return;
  const colName = name.trim();
  if (!activeTabularColumns.includes(colName)) { alert('Column not found: ' + colName); return; }
  activeTabulatorInstance.deleteColumn(colName);
  activeTabularColumns = activeTabularColumns.filter(c => c !== colName);
  const key = getCurrentFileKey();
  if (key && openFiles[key]) {
    openFiles[key].modified = true;
    renderWsTabs();
  }
}

function getTabulatorSerializedContent(relPath) {
  if (!activeTabulatorInstance || !activeTabularColumns) return null;
  const data = activeTabulatorInstance.getData();
  const delimiter = getTabularDelimiter(relPath);
  return serializeToDelimited(activeTabularColumns, data, delimiter);
}

// ═══════════════════════════════════════════════════════════════
// Workspace tabs & file state
// ═══════════════════════════════════════════════════════════════

// openFiles[relPath] = { content, absPath, originalContent, modified, editMode, tabularData, tabulatorInstance }
let openFiles = {};
let fileTabOrder = [];   // ordered relPaths
let activeTabId = 'chat'; // 'chat' or a relPath
let splitMode = false;

function openFileTab(relPath, content, absPath) {
  if (relPath in openFiles) {
    // Update content if not modified by user
    const f = openFiles[relPath];
    if (!f.modified && !f.editMode) {
      f.content = content;
      f.originalContent = content;
    }
  } else {
    openFiles[relPath] = {
      content,
      absPath: absPath || relPath,
      originalContent: content,
      modified: false,
      editMode: false,
      tabularData: null,
      tabulatorInstance: null,
    };
    fileTabOrder.push(relPath);
    sortFileTabs();
  }

  if (splitMode) {
    // In split mode, file tabs show in file pane — switch to this file
    renderWsTabs();
    showFileInPane(relPath);
  } else {
    // In single mode, switch to this tab
    activeTabId = relPath;
    renderWsTabs();
    showActiveContent();
  }
}

function closeFileTab(relPath) {
  // Save check
  const f = openFiles[relPath];
  if (f && f.modified) {
    if (!confirm(`"${relPath.split('/').pop()}" has unsaved changes. Close anyway?`)) return;
  }

  // Destroy Tabulator if this file had one
  if (f && f.tabulatorInstance) {
    const currentKey = getCurrentFileKey();
    if (relPath === currentKey) destroyTabulator();
  }

  delete openFiles[relPath];
  fileTabOrder = fileTabOrder.filter(p => p !== relPath);

  if (activeTabId === relPath) {
    activeTabId = fileTabOrder.length > 0 ? fileTabOrder[0] : 'chat';
  }
  renderWsTabs();
  showActiveContent();
}

function sortFileTabs() {
  fileTabOrder.sort((a, b) => {
    const aS = a.endsWith('project-specs.md') ? 0 : 1;
    const bS = b.endsWith('project-specs.md') ? 0 : 1;
    if (aS !== bS) return aS - bS;
    return a.localeCompare(b);
  });
}

function switchTab(id) {
  if (splitMode && id !== 'chat') {
    // In split mode, clicking a file tab switches the file pane
    showFileInPane(id);
    renderWsTabs();
    return;
  }
  activeTabId = id;
  renderWsTabs();
  showActiveContent();
}

function renderWsTabs() {
  const bar = document.getElementById('ws-tab-bar');
  // Remove existing tabs (keep actions)
  const actions = document.getElementById('ws-tab-actions');
  bar.innerHTML = '';

  // Chat tab (pinned)
  const chatTab = document.createElement('div');
  chatTab.className = 'ws-tab pinned' + (activeTabId === 'chat' && !splitMode ? ' active' : '') + (splitMode ? ' in-split' : '');
  chatTab.textContent = 'Chat';
  chatTab.addEventListener('click', () => switchTab('chat'));
  bar.appendChild(chatTab);

  // File tabs
  for (const p of fileTabOrder) {
    const f = openFiles[p];
    if (!f) continue;
    const tab = document.createElement('div');
    const isActive = splitMode ? (p === currentFileInPane) : (p === activeTabId);
    tab.className = 'ws-tab' + (isActive ? ' active' : '') + (f.modified ? ' modified' : '');
    tab.dataset.path = p;

    const name = p.split('/').pop();
    tab.innerHTML =
      `<span class="tab-dot"></span>` +
      `<span class="modified-dot"></span>` +
      `${esc(name)}` +
      ` <span class="close-btn" title="Close">x</span>`;

    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-btn')) { closeFileTab(p); return; }
      switchTab(p);
    });
    bar.appendChild(tab);
  }

  bar.appendChild(actions);

  // Split button state
  document.getElementById('split-btn').className = splitMode ? 'active' : '';
}

// Which file is shown in the file pane (used in split mode)
let currentFileInPane = null;

function showActiveContent() {
  const chatPane = document.getElementById('chat-pane');
  const filePane = document.getElementById('file-pane');
  const splitResize = document.getElementById('split-resize');

  if (splitMode) {
    chatPane.style.display = 'flex';
    splitResize.style.display = 'block';
    filePane.classList.add('visible');
    if (currentFileInPane && openFiles[currentFileInPane]) {
      renderFilePane(currentFileInPane);
    } else if (fileTabOrder.length > 0) {
      showFileInPane(fileTabOrder[0]);
    } else {
      renderEmptyFilePane();
    }
    return;
  }

  // Single mode
  splitResize.style.display = 'none';

  if (activeTabId === 'chat') {
    chatPane.style.display = 'flex';
    filePane.classList.remove('visible');
  } else {
    chatPane.style.display = 'none';
    filePane.classList.add('visible');
    renderFilePane(activeTabId);
  }
}

function showFileInPane(relPath) {
  currentFileInPane = relPath;
  renderFilePane(relPath);
  renderWsTabs();
}

function renderEmptyFilePane() {
  document.getElementById('file-path-display').textContent = '';
  document.getElementById('edit-btn').style.display = 'none';
  document.getElementById('save-btn').style.display = 'none';
  document.getElementById('file-rendered-view').classList.remove('visible');
  document.getElementById('file-rendered-view').innerHTML = '';
  document.getElementById('file-editor').style.display = 'none';
  document.getElementById('table-view').classList.remove('visible');
  destroyTabulator();

  const rendered = document.getElementById('file-rendered-view');
  rendered.classList.add('visible');
  rendered.innerHTML = '<div class="no-file-msg">Open a file from the explorer</div>';
}

// ═══════════════════════════════════════════════════════════════
// File pane rendering
// ═══════════════════════════════════════════════════════════════

function renderFilePane(relPath) {
  const f = openFiles[relPath];
  if (!f) { renderEmptyFilePane(); return; }

  document.getElementById('file-path-display').textContent = relPath;
  document.getElementById('edit-btn').style.display = '';

  const ext = relPath.split('.').pop().toLowerCase();
  const isMarkdown = ext === 'md';
  const isNotebook = ext === 'ipynb';
  const isTabular = isTabularFile(relPath) && typeof Tabulator !== 'undefined';

  // Edit/Raw/Table button label
  if (isTabular) {
    document.getElementById('edit-btn').textContent = f.editMode ? 'Table' : 'Raw';
    // Show save button when tabular is modified (even without editMode) or in raw edit mode
    document.getElementById('save-btn').style.display = (f.modified || f.editMode) ? '' : 'none';
  } else {
    document.getElementById('edit-btn').textContent = f.editMode ? 'View' : 'Edit';
    document.getElementById('save-btn').style.display = f.editMode ? '' : 'none';
  }

  const renderedView = document.getElementById('file-rendered-view');
  const editorEl = document.getElementById('file-editor');
  const codeView = document.getElementById('code-view');
  const codeEdit = document.getElementById('code-edit');
  const gutter = document.getElementById('line-gutter');
  const tableView = document.getElementById('table-view');

  // Helper to hide all views
  function hideAll() {
    renderedView.classList.remove('visible');
    renderedView.innerHTML = '';
    editorEl.style.display = 'none';
    tableView.classList.remove('visible');
    destroyTabulator();
  }

  if (f.editMode) {
    // Edit mode — always show textarea with line numbers (raw text for tabular too)
    hideAll();
    editorEl.style.display = 'flex';
    codeView.style.display = 'none';
    codeEdit.classList.add('visible');
    codeEdit.value = f.content;
    updateLineGutter(f.content);
    codeEdit.focus();
  } else if (isTabular) {
    // Table view
    hideAll();
    tableView.classList.add('visible');
    // Load and init Tabulator if not already loaded
    if (!f.tabularData) {
      loadTabularData(relPath, f).then(data => {
        f.tabularData = data;
        initTabulator(relPath, data);
      }).catch(err => {
        // Fall back to code view on parse error
        console.warn('Tabular parse failed, falling back to code view:', err);
        tableView.classList.remove('visible');
        editorEl.style.display = 'flex';
        codeView.style.display = 'block';
        codeEdit.classList.remove('visible');
        const lang = getLang(relPath);
        document.getElementById('code-view-code').innerHTML = highlightCode(esc(f.content), lang);
        updateLineGutter(f.content);
      });
    } else {
      initTabulator(relPath, f.tabularData);
    }
  } else if (isMarkdown) {
    // Markdown rendered view
    hideAll();
    renderedView.classList.add('visible');
    renderedView.innerHTML = `<div class="file-rendered">${renderMarkdown(f.content)}</div>`;
  } else if (isNotebook) {
    // Notebook rendered view
    hideAll();
    renderedView.classList.add('visible');
    let html = '<div class="file-rendered">';
    try {
      const nb = JSON.parse(f.content);
      for (const cell of nb.cells || []) {
        const src = Array.isArray(cell.source) ? cell.source.join('') : (cell.source || '');
        if (cell.cell_type === 'markdown') {
          html += renderMarkdown(src);
        } else {
          html += `<pre><code>${highlightCode(esc(src), 'python')}</code></pre>`;
        }
        html += '<hr>';
      }
    } catch { html += `<pre>${esc(f.content)}</pre>`; }
    html += '</div>';
    renderedView.innerHTML = html;
  } else {
    // Code view with line numbers + syntax highlighting
    hideAll();
    editorEl.style.display = 'flex';
    codeView.style.display = 'block';
    codeEdit.classList.remove('visible');
    const lang = getLang(relPath);
    document.getElementById('code-view-code').innerHTML = highlightCode(esc(f.content), lang);
    updateLineGutter(f.content);
  }
}

function updateLineGutter(content) {
  const gutter = document.getElementById('line-gutter');
  const lineCount = (content.match(/\n/g) || []).length + 1;
  const lines = [];
  for (let i = 1; i <= lineCount; i++) lines.push(i);
  gutter.textContent = lines.join('\n');
}

// ═══════════════════════════════════════════════════════════════
// Edit mode toggle & save
// ═══════════════════════════════════════════════════════════════

function getCurrentFileKey() {
  return splitMode ? currentFileInPane : activeTabId;
}

function toggleEditMode() {
  const key = getCurrentFileKey();
  if (!key || key === 'chat' || !openFiles[key]) return;
  const f = openFiles[key];

  if (isTabularFile(key) && isEditableTabular(key)) {
    if (!f.editMode) {
      // Table → Raw: serialize current Tabulator data to text
      const serialized = getTabulatorSerializedContent(key);
      if (serialized !== null) {
        f.content = serialized;
      }
      f.tabularData = null;
      destroyTabulator();
    } else {
      // Raw → Table: clear tabular data so it re-parses
      f.tabularData = null;
    }
  }

  f.editMode = !f.editMode;
  renderFilePane(key);
}

async function saveCurrentFile() {
  const key = getCurrentFileKey();
  if (!key || key === 'chat' || !openFiles[key]) return;
  const f = openFiles[key];

  // If Tabulator is active (not in raw edit mode), serialize table data first
  let contentToSave = f.content;
  if (isTabularFile(key) && isEditableTabular(key) && !f.editMode && activeTabulatorInstance) {
    const serialized = getTabulatorSerializedContent(key);
    if (serialized !== null) {
      contentToSave = serialized;
      f.content = serialized;
    }
  }

  try {
    const res = await fetch('/browse/file/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: f.absPath, content: contentToSave }),
    });
    const data = await res.json();
    if (data.error) { alert('Save failed: ' + data.error); return; }
    f.originalContent = contentToSave;
    f.modified = false;
    renderWsTabs();
  } catch (err) {
    alert('Save failed: ' + err.message);
  }
}

// Track edits in textarea
document.getElementById('code-edit').addEventListener('input', (e) => {
  const key = getCurrentFileKey();
  if (!key || !openFiles[key]) return;
  const f = openFiles[key];
  f.content = e.target.value;
  f.modified = f.content !== f.originalContent;
  updateLineGutter(f.content);
  renderWsTabs();
});

// Ctrl+S to save
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    const key = getCurrentFileKey();
    if (key && key !== 'chat' && openFiles[key] && (openFiles[key].editMode || openFiles[key].modified)) {
      e.preventDefault();
      saveCurrentFile();
    }
  }
});

// Tab key in textarea inserts 4 spaces
document.getElementById('code-edit').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
    ta.dispatchEvent(new Event('input'));
  }
});

// Sync scroll between gutter and content
document.getElementById('file-view-area').addEventListener('scroll', function () {
  document.getElementById('line-gutter').scrollTop = this.scrollTop;
});

// ═══════════════════════════════════════════════════════════════
// Split view
// ═══════════════════════════════════════════════════════════════

function toggleSplit() {
  splitMode = !splitMode;
  const chatPane = document.getElementById('chat-pane');

  if (splitMode) {
    // Enter split mode
    activeTabId = 'chat'; // chat always active in split
    if (!currentFileInPane && fileTabOrder.length > 0) {
      currentFileInPane = fileTabOrder[0];
    }
    chatPane.style.flex = '1';
    document.getElementById('file-pane').style.flex = '1';
  } else {
    // Exit split mode
    chatPane.style.flex = '';
    document.getElementById('file-pane').style.flex = '';
    if (currentFileInPane && openFiles[currentFileInPane]) {
      activeTabId = currentFileInPane;
    } else {
      activeTabId = 'chat';
    }
  }

  renderWsTabs();
  showActiveContent();
}

function initSplitResize() {
  const handle = document.getElementById('split-resize');
  const chatPane = document.getElementById('chat-pane');
  const filePane = document.getElementById('file-pane');
  let startX, chatStartW, fileStartW;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    chatStartW = chatPane.offsetWidth;
    fileStartW = filePane.offsetWidth;
    handle.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  function onMove(e) {
    const delta = e.clientX - startX;
    const totalW = chatStartW + fileStartW;
    const newChatW = Math.max(200, Math.min(totalW - 200, chatStartW + delta));
    const newFileW = totalW - newChatW;
    chatPane.style.flex = 'none';
    filePane.style.flex = 'none';
    chatPane.style.width = newChatW + 'px';
    filePane.style.width = newFileW + 'px';
  }

  function onUp() {
    handle.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
}

// ═══════════════════════════════════════════════════════════════
// File auto-refresh
// ═══════════════════════════════════════════════════════════════

function initFileAutoRefresh() {
  setInterval(async () => {
    for (const relPath of fileTabOrder) {
      const f = openFiles[relPath];
      if (!f || f.editMode || f.modified) continue;

      try {
        const res = await fetch(`/browse/file?path=${encodeURIComponent(f.absPath)}`);
        const data = await res.json();
        if (data.error) continue;
        if (data.content !== f.content) {
          f.content = data.content;
          f.originalContent = data.content;
          f.tabularData = null; // Force re-parse for tabular files
          const currentKey = getCurrentFileKey();
          if (relPath === currentKey) {
            renderFilePane(relPath);
          } else {
            // Mark unread
            const tabEl = document.querySelector(`[data-path="${CSS.escape(relPath)}"]`);
            if (tabEl) tabEl.classList.add('unread');
          }
        }
      } catch {}
    }
  }, 3000);
}

// ═══════════════════════════════════════════════════════════════
// Artifact updates (from agent output polling)
// ═══════════════════════════════════════════════════════════════

function handleArtifactUpdate(relPath, content) {
  if (relPath in openFiles) {
    const f = openFiles[relPath];
    if (!f.modified && !f.editMode) {
      f.content = content;
      f.originalContent = content;
      f.tabularData = null; // Force re-parse for tabular files
      const currentKey = getCurrentFileKey();
      if (relPath === currentKey) {
        renderFilePane(relPath);
      } else {
        const tabEl = document.querySelector(`[data-path="${CSS.escape(relPath)}"]`);
        if (tabEl) tabEl.classList.add('unread');
      }
    }
  } else {
    // Auto-open artifact files
    openFileTab(relPath, content, relPath);
  }
}

// ═══════════════════════════════════════════════════════════════
// Chat state
// ═══════════════════════════════════════════════════════════════

let chatSessionId = null;
let chatAgent = null;
let chatResponding = false;
let chatMessages = [];

// Streaming state
let pendingBubble = null;
let tokenBuffer = '';
let tokenFlushPending = false;

// ═══════════════════════════════════════════════════════════════
// Agent picker
// ═══════════════════════════════════════════════════════════════

let agentList = null;

async function loadAgentPicker() {
  const picker = document.getElementById('agent-picker');
  picker.classList.add('visible');

  if (!agentList) {
    try {
      const res = await fetch('/agents');
      agentList = await res.json();
    } catch {
      picker.innerHTML = '<div class="empty-state">Failed to load agents</div>';
      return;
    }
  }

  picker.innerHTML = '';
  for (const agent of agentList) {
    const info = AGENTS[agent.name] || { color: '#666', label: agent.name };
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.innerHTML = `
      <span class="agent-card-dot" style="background:${info.color}"></span>
      <span class="agent-card-name">${esc(info.label)}</span>
      <span class="agent-card-desc">${esc(info.desc || agent.description || '')}</span>`;
    card.addEventListener('click', () => startChat(agent.name));
    picker.appendChild(card);
  }
}

function showAgentPicker() {
  document.getElementById('messages').style.display = 'none';
  document.getElementById('chat-input-area').classList.remove('visible');
  loadAgentPicker();
}

function showChatView() {
  document.getElementById('agent-picker').classList.remove('visible');
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('chat-input-area').classList.add('visible');
}

// ═══════════════════════════════════════════════════════════════
// Chat session control
// ═══════════════════════════════════════════════════════════════

async function startChat(agentName) {
  try {
    const res = await fetch('/chat/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: agentName }),
    });
    const data = await res.json();
    if (data.error) return;

    chatSessionId = data.sessionId;
    chatAgent = agentName;
    chatMessages = [];
    chatResponding = false;

    showChatView();
    document.getElementById('messages').innerHTML = '';
    hasMessages = false;

    activateAgent(agentName);

    // Make sure chat pane is visible
    if (!splitMode) {
      activeTabId = 'chat';
      renderWsTabs();
      showActiveContent();
    }

    document.getElementById('chat-input').focus();
  } catch (err) {}
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message || chatResponding) return;

  input.value = '';

  try {
    await fetch('/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
  } catch (err) {}
}

async function stopChat() {
  try {
    await fetch('/chat/stop', { method: 'POST' });
  } catch {}
  endChatSession();
}

function endChatSession() {
  chatSessionId = null;
  chatAgent = null;
  chatResponding = false;
  pendingBubble = null;
  tokenBuffer = '';

  setChatInputEnabled(true);
  showAgentPicker();
}

function setChatInputEnabled(enabled) {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  input.disabled = !enabled;
  btn.disabled = !enabled;
  chatResponding = !enabled;
}

// Enter key to send
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

// ═══════════════════════════════════════════════════════════════
// Streaming token display
// ═══════════════════════════════════════════════════════════════

function ensurePendingBubble() {
  if (pendingBubble) return;

  const container = document.getElementById('messages');
  if (!hasMessages) { container.innerHTML = ''; hasMessages = true; }

  const info = AGENTS[chatAgent] || { color: '#666', label: chatAgent || 'Agent' };
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="message-meta">
      <span class="meta-dot" style="background:${info.color}"></span>
      ${esc(info.label)}
    </div>
    <div class="message-bubble" style="border-left-color:${info.color}"></div>`;
  container.appendChild(div);
  pendingBubble = div.querySelector('.message-bubble');
  container.scrollTop = container.scrollHeight;
}

function appendToken(text) {
  tokenBuffer += text;
  if (!tokenFlushPending) {
    tokenFlushPending = true;
    requestAnimationFrame(flushTokens);
  }
}

function flushTokens() {
  tokenFlushPending = false;
  if (!pendingBubble || !tokenBuffer) return;
  pendingBubble.appendChild(document.createTextNode(tokenBuffer));
  tokenBuffer = '';
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function finalizePendingBubble(markdownContent) {
  flushTokens();
  if (pendingBubble) {
    pendingBubble.innerHTML = renderMarkdown(markdownContent);
    pendingBubble = null;
  }
  tokenBuffer = '';
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function addToolIndicator(toolName) {
  const container = document.getElementById('messages');
  if (!hasMessages) { container.innerHTML = ''; hasMessages = true; }
  const div = document.createElement('div');
  div.className = 'tool-indicator';
  div.innerHTML = `<span class="tool-name">${esc(toolName)}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════
// Conversation panel
// ═══════════════════════════════════════════════════════════════

let hasMessages = false;

function addMessageDirect(role, content, agent) {
  const container = document.getElementById('messages');
  if (!hasMessages) { container.innerHTML = ''; hasMessages = true; }

  const info = AGENTS[agent] || { color: '#666', label: agent || 'Unknown' };
  const div = document.createElement('div');
  div.className = `message ${role === 'user' ? 'user' : 'assistant'}`;

  if (role === 'user') {
    div.innerHTML = `
      <div class="message-meta">You</div>
      <div class="message-bubble">${esc(content)}</div>`;
  } else {
    div.innerHTML = `
      <div class="message-meta">
        <span class="meta-dot" style="background:${info.color}"></span>
        ${esc(info.label)}
      </div>
      <div class="message-bubble" style="border-left-color:${info.color}">${renderMarkdown(content)}</div>`;
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function rebuildMessages(msgArray) {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  hasMessages = false;
  if (msgArray.length === 0) {
    container.innerHTML = '<div class="empty-state">Select an agent to start chatting</div>';
    return;
  }
  for (const msg of msgArray) {
    addMessageDirect(msg.role, msg.content, msg.agent);
  }
}

// ═══════════════════════════════════════════════════════════════
// SSE connection
// ═══════════════════════════════════════════════════════════════

function handleSSEEvent(e) {
  let data;
  try { data = JSON.parse(e.data); } catch { return; }

  switch (data.type) {
    case 'connected': break;

    case 'user-message':
    case 'agent-message':
      break;

    case 'agent-activated':
      break;

    case 'agent-changed':
      break;

    case 'agent-consulting':
      break;

    case 'artifact-updated':
      handleArtifactUpdate(data.path, data.content);
      break;

    case 'event-log':
      break;

    case 'session-end':
      break;

    // ─── Chat events ─────────────────────────────────────────
    case 'chat-started':
      break;

    case 'chat-user-message':
      chatMessages.push({ role: 'user', content: data.content, agent: data.agent });
      addMessageDirect('user', data.content, data.agent);
      setChatInputEnabled(false);
      break;

    case 'chat-token':
      ensurePendingBubble();
      appendToken(data.text);
      break;

    case 'chat-tool-use':
      if (pendingBubble && tokenBuffer) flushTokens();
      addToolIndicator(data.tool);
      break;

    case 'chat-tool-input-delta':
      break;

    case 'chat-block-stop':
      break;

    case 'chat-message':
      chatMessages.push({ role: 'assistant', content: data.content, agent: data.agent });
      if (pendingBubble) {
        finalizePendingBubble(data.content);
      } else {
        addMessageDirect('assistant', data.content, data.agent);
      }
      break;

    case 'chat-turn-end':
      setChatInputEnabled(true);
      document.getElementById('chat-input').focus();
      break;

    case 'chat-init':
      break;

    case 'chat-error':
      break;

    case 'chat-ended':
      endChatSession();
      break;
  }
}

function connect() {
  const indicator = document.getElementById('conn-indicator');
  const text = document.getElementById('conn-text');
  const es = new EventSource('/events');

  es.onopen = () => {
    indicator.className = 'conn-indicator connected';
    text.textContent = 'Connected';
  };
  es.onmessage = handleSSEEvent;
  es.onerror = () => {
    indicator.className = 'conn-indicator disconnected';
    text.textContent = 'Reconnecting...';
    es.close();
    setTimeout(connect, 3000);
  };
}

// ═══════════════════════════════════════════════════════════════
// Initial load
// ═══════════════════════════════════════════════════════════════

async function loadInitial() {
  try {
    const [fRes, cRes] = await Promise.all([
      fetch('/files'),
      fetch('/chat/status'),
    ]);
    const files = await fRes.json();
    const chatStatus = await cRes.json();

    for (const [p, c] of Object.entries(files)) {
      handleArtifactUpdate(p, c);
    }

    // Restore active chat session if one is running
    if (chatStatus.active) {
      chatSessionId = chatStatus.sessionId;
      chatAgent = chatStatus.agent;
      activateAgent(chatAgent);
      showChatView();
      rebuildMessages(chatMessages);
    } else {
      showAgentPicker();
    }
  } catch {
    showAgentPicker();
  }

  // Ensure chat tab is active initially
  activeTabId = 'chat';
  renderWsTabs();
  showActiveContent();
}

// ═══════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════

loadInitial();
connect();
browseDir();
initExplorerResize();
initSplitResize();
initFileAutoRefresh();
</script>
